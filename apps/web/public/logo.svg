<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient: Royal Blue to Electric Cyan -->
    <linearGradient id="anDevGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D6EFD" />
      <stop offset="60%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#00C3FF" />
    </linearGradient>

    <!-- 3D Fold Ribbon Shadow -->
    <linearGradient id="anFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047BA" />
      <stop offset="100%" stop-color="#002466" />
    </linearGradient>

    <!-- Squircle container background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1636" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
  </defs>

  <!-- Dark Squircle Background Tile with subtle border -->
  <rect x="2" y="2" width="196" height="196" rx="44" fill="url(#bgGrad)" stroke="#1A2850" stroke-width="3" />

  <!-- Centered AN Monogram Group -->
  <g transform="translate(18, 32)">
    <!-- Speed Traces (Motion & Data Packets on left) -->
    <g fill="url(#anDevGrad)">
      <!-- Top floating circle -->
      <circle cx="20" cy="44" r="4" />
      <!-- Speed Pill 1 -->
      <rect x="26" y="40" width="30" height="7.5" rx="3.75" />
      <!-- Speed Pill 2 -->
      <rect x="0" y="62" width="54" height="8.5" rx="4.25" />
      <!-- Speed Pill 3 (Crossbar connector) -->
      <rect x="-8" y="84" width="62" height="9.5" rx="4.75" />
      <!-- Bottom floating circle 1 -->
      <circle cx="8" cy="108" r="4.5" />
      <!-- Bottom floating circle 2 -->
      <circle cx="28" cy="108" r="3.5" />
    </g>

    <!-- A & N Monogram Main Body -->
    <g>
      <!-- Left diagonal leg of A -->
      <path
        d="M52 108 L90 12 L120 12 L78 108 Z"
        fill="url(#anDevGrad)"
      />

      <!-- Crossbar of A -->
      <rect x="42" y="84" width="80" height="9.5" rx="2" fill="url(#anDevGrad)" />

      <!-- Fold apex ribbon -->
      <path
        d="M90 12 L120 12 L166 100 L144 100 Z"
        fill="url(#anFoldGrad)"
        opacity="0.9"
      />

      <!-- Diagonal stroke of N / Right stroke of A -->
      <path
        d="M112 12 L176 124 L204 124 L140 12 Z"
        fill="url(#anDevGrad)"
      />

      <!-- Right vertical stem of N -->
      <rect
        x="138"
        y="12"
        width="28"
        height="112"
        rx="3"
        fill="url(#anDevGrad)"
      />

      <!-- Code Badge: Dark Inset Polygon with White </> -->
      <g transform="translate(100, 60)">
        <polygon
          points="8,0 42,0 56,22 50,56 14,56 0,26"
          fill="#0B101E"
          stroke="#1E293B"
          stroke-width="1.8"
        />
        <!-- < -->
        <path
          d="M16 28 L10 33 L16 38"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <!-- / -->
        <path
          d="M24 24 L20 42"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2"
          stroke-linecap="round"
        />
        <!-- > -->
        <path
          d="M28 28 L34 33 L28 38"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </g>
    </g>
  </g>
</svg>
