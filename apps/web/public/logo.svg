<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Primary Cyan-to-Blue Brand Gradient -->
    <linearGradient id="anDevGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D6EFD" />
      <stop offset="50%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#00C3FF" />
    </linearGradient>

    <!-- Fold / Shadow Gradient for 3D depth -->
    <linearGradient id="anFoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0050C8" />
      <stop offset="100%" stop-color="#002D80" />
    </linearGradient>

    <!-- Subtle glow filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Speed Traces (Motion & Data Packets on left) -->
  <g fill="url(#anDevGradient)">
    <!-- Top-left floating dot -->
    <circle cx="140" cy="170" r="5.5" />
    <!-- Horizontal Speed Pill 1 -->
    <rect x="150" y="165" width="45" height="10" rx="5" />
    <!-- Horizontal Speed Pill 2 -->
    <rect x="110" y="195" width="75" height="11" rx="5.5" />
    <!-- Horizontal Speed Pill 3 (Middle crossbar connector) -->
    <rect x="85" y="225" width="85" height="12" rx="6" />
    <!-- Bottom floating dot 1 -->
    <circle cx="95" cy="255" r="6" />
    <!-- Bottom floating dot 2 -->
    <circle cx="120" cy="255" r="4.5" />
  </g>

  <!-- Main Monogram Geometry (A + N Unified Mark) -->
  <g>
    <!-- Left diagonal leg of A with speed cutouts -->
    <path
      d="M165 255 L215 130 L255 130 L195 255 Z"
      fill="url(#anDevGradient)"
    />

    <!-- Crossbar of A connecting across to N -->
    <rect x="145" y="225" width="105" height="12" rx="3" fill="url(#anDevGradient)" />

    <!-- Ribbon Fold on top of A transitioning into N's diagonal -->
    <path
      d="M215 130 L255 130 L310 245 L280 245 Z"
      fill="url(#anFoldGradient)"
      opacity="0.85"
    />

    <!-- Diagonal stroke of N / Right stroke of A -->
    <path
      d="M245 130 L325 275 L360 275 L280 130 Z"
      fill="url(#anDevGradient)"
    />

    <!-- Right vertical stem of N -->
    <rect
      x="365"
      y="130"
      width="38"
      height="145"
      rx="4"
      fill="url(#anDevGradient)"
    />

    <!-- Code Badge (Dark inset polygon with </> in bottom right) -->
    <g transform="translate(305, 195)">
      <polygon
        points="10,0 55,0 75,30 65,75 20,75 0,35"
        fill="#111622"
        stroke="#1E293B"
        stroke-width="2"
      />
      <!-- Brackets & Slash: < / > -->
      <path
        d="M22 38 L14 45 L22 52"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M33 34 L27 56"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linecap="round"
      />
      <path
        d="M38 38 L46 45 L38 52"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
  </g>

  <!-- Wordmark Text: AN DEV -->
  <text
    x="170"
    y="360"
    font-family="'Inter', 'Poppins', sans-serif"
    font-size="64"
    font-weight="900"
    letter-spacing="2"
    fill="#FFFFFF"
  >
    AN
  </text>
  <text
    x="285"
    y="360"
    font-family="'Inter', 'Poppins', sans-serif"
    font-size="64"
    font-weight="900"
    letter-spacing="2"
    fill="#00C3FF"
  >
    DEV
  </text>

  <!-- Subtitle Tagline: CODE • CREATE • SOLVE -->
  <text
    x="250"
    y="405"
    text-anchor="middle"
    font-family="'Inter', 'Poppins', monospace"
    font-size="14"
    font-weight="700"
    letter-spacing="6"
    fill="#E6E6E6"
  >
    CODE <tspan fill="#00C3FF">•</tspan> CREATE <tspan fill="#00C3FF">•</tspan> SOLVE
  </text>
</svg>